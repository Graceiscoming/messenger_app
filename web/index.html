<!doctype html>
<html lang="th" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Messenger</title>
    <script>
      // Apply theme / language / font size before first paint (avoids a light-mode flash).
      // Mirrors web/src/store/settings.ts (same storage key).
      (function () {
        var r = document.documentElement;
        try {
          var s = JSON.parse(localStorage.getItem('messenger.settings') || '{}');
          var th = s.theme || 'system';
          var dark = th === 'dark' || (th === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          r.dataset.theme = dark ? 'dark' : 'light';
          if (s.language) r.lang = s.language;
          if (s.fontSize) r.dataset.font = s.fontSize;
        } catch (e) {
          r.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
